[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papayya"
version = "0.3.0"
description = "Durable execution and per-item observability for periodic LLM jobs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Kingsley Torlowei" },
]
keywords = ["ai", "agents", "durable", "background-jobs", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27,<1",
    # >=8.2 specifically: 8.2 removed CliRunner(mix_stderr=...) and made stderr
    # a separate stream. The CLI tests read result.stderr, which raises
    # "stderr not separately captured" on 8.1.x — so 8.1 satisfied the old
    # `click>=8` pin while silently failing 17 of them.
    "click>=8.2,<9",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "psutil>=6,<8",
    "croniter>=2,<7",
]

[project.urls]
Homepage = "https://getpapayya.com"
Documentation = "https://docs.getpapayya.com"
Repository = "https://github.com/papayya-zero/papayya-python"

[project.scripts]
papayya = "papayya.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "build", "twine"]
dev = []
# OpenTelemetry baggage propagation for auto-captured LLM cost (Plan 07).
# Strictly optional: pip install papayya stays unchanged; customers who
# want OTel-based cost attribution add this extra and the @agent wrapper
# starts setting baggage + span attrs that the control-pane mapper
# reads. opentelemetry-api alone is enough at runtime; the sdk extra is
# included so customers who only install papayya[otel] also get a
# working exporter pipeline.
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
# The dependency set the HOSTED WORKER POOL carries (ADR 0010). This extra is
# the single source of truth for two things that must not drift:
#
#   1. runtime-images/python-bootstrap/Dockerfile installs it, so the worker
#      can import these without a per-bundle pip step.
#   2. `papayya deploy` reads it back out of installed package metadata to
#      preflight a bundle's requirements.txt, so a dependency the pool does
#      not carry fails the DEPLOY with a named list rather than item 1 of 200
#      with ModuleNotFoundError.
#
# Not installed by `pip install papayya` — a customer's own machine already has
# whatever their agent imports. Adding a name here means rebuilding the worker
# image and rolling the pool; that friction is the point, and it is why
# per-bundle installation is the eventual answer (ADR 0010 § 4, § 7).
runtime = [
    "openai>=1.0",
    "anthropic>=0.40",
    "tiktoken>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/papayya"]

[tool.hatch.build.targets.sdist]
exclude = [
    "uv.lock",
    "examples/enrich_companies.py",
    "DESIGN_PARTNERS.md",
    ".papayya-test/",
    "tests/",
]
